[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "opengcua-mcp"
version = "0.3.0"
description = "Model-driven bounded UI operations and desktop diagnostics for OpenGCUA"
requires-python = ">=3.11,<3.15"
dependencies = ["mcp==1.30.0", "qwen-intelligence-sdk==0.3.1", "pyobjc-framework-Cocoa==12.2.2; sys_platform == 'darwin'"]

[project.scripts]
opengcua-mcp = "opengcua_mcp.server:main"

[tool.setuptools.packages.find]
include = ["opengcua_mcp*"]
